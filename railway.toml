# Railway Configuration for Sierra Class Helper
# Two services: the API (which also runs the in-process refresh scheduler)
# and the Discord bot.
#
# We intentionally do NOT have separate course-updater / ratings-updater cron
# services. Railway volumes can't be shared between services, so a standalone
# cron container would scrape Sierra successfully but its file writes would
# never reach the api process. Instead, an apscheduler BackgroundScheduler
# inside the api service runs the refresh jobs on the same filesystem the
# api reads from. See src/api/scheduler.py.

[build]
builder = "NIXPACKS"

# API Server Service
# Runs the FastAPI app + the in-process scheduler for course/ratings refresh.
# Needs Playwright/Chromium because the scrape runs in this container.
[[services]]
name = "api"
source = "."

[services.buildCommand]
# --with-deps installs the Linux system libraries Chromium needs
# (libnss3, libatk-bridge2.0-0, libgbm1, etc.). Without it the
# browser fails to launch on the Railway Nixpacks image.
command = "pip install -r requirements.txt && playwright install --with-deps chromium"

[services.startCommand]
command = "python api_server.py"

[services.healthcheck]
path = "/health"
interval = 30
timeout = 10

[services.env]
PORT = "8000"
ENVIRONMENT = "production"
# Turn on the BackgroundScheduler that runs the hourly course scrape and
# daily ratings refresh. Off by default so tests and local dev don't kick
# off network scrapes.
SIERRA_ENABLE_SCHEDULER = "1"
# Path to the Railway Volume mounted on this service. All persistent data
# (course index, scraped JSON, professor ratings, analytics SQLite) lives
# here so it survives container restarts.
SIERRA_DATA_DIR = "/data"
# Shared secret protecting /admin/stats. Generate a random string and set
# this in Railway's dashboard (Variables tab) instead of committing it.
# SIERRA_ADMIN_TOKEN must also be set in the dashboard.

# Discord Bot Service
[[services]]
name = "bot"
source = "."

[services.buildCommand]
command = "pip install -r requirements.txt"

[services.startCommand]
command = "python discord_bot.py"

[services.env]
# API_URL will be automatically set to the Railway internal URL of the API service
# Format: https://api.railway.internal:8000
API_URL = "${{api.RAILWAY_PRIVATE_DOMAIN}}"
ENVIRONMENT = "production"
