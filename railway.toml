# Railway Configuration for Sierra Class Helper
# This file defines two services: API and Discord Bot

[build]
builder = "NIXPACKS"

# API Server Service
[[services]]
name = "api"
source = "."

[services.buildCommand]
command = "pip install -r requirements.txt"

[services.startCommand]
command = "python api_server.py"

[services.healthcheck]
path = "/health"
interval = 30
timeout = 10

[services.env]
PORT = "8000"
ENVIRONMENT = "production"

# Discord Bot Service
[[services]]
name = "bot"
source = "."

[services.buildCommand]
command = "pip install -r requirements.txt"

[services.startCommand]
command = "python discord_bot.py"

[services.env]
# API_URL will be automatically set to the Railway internal URL of the API service
# Format: https://api.railway.internal:8000
API_URL = "${{api.RAILWAY_PRIVATE_DOMAIN}}"

# Course Update Cron Job
# Runs hourly from 8am-8pm PST to keep course data fresh
[[services]]
name = "course-updater"
source = "."

[services.buildCommand]
# --with-deps installs the Linux system libraries Chromium needs
# (libnss3, libatk-bridge2.0-0, libgbm1, etc.). Without it the
# browser fails to launch on the Railway Nixpacks image.
command = "pip install -r requirements.txt && playwright install --with-deps chromium"

[services.startCommand]
command = "python update_courses.py"

[services.cron]
# Run every hour from 8am to 8pm Pacific Daylight Time (PDT)
# In UTC: 3pm-11pm + midnight-3am = 15-23,0-3
# Note: During PST (winter), this runs 9am-9pm instead of 8am-8pm
schedule = "0 15-23,0-3 * * *"

[services.env]
ENVIRONMENT = "production"

# RateMyProfessors Ratings Updater Cron Job
# Refreshes professor_ratings.json daily. Ratings change slowly so once a day is plenty.
[[services]]
name = "ratings-updater"
source = "."

[services.buildCommand]
command = "pip install -r requirements.txt"

[services.startCommand]
command = "python -m src.scraper.ratemyprofessors"

[services.cron]
# Daily at 2am Pacific (10am UTC during PDT, 9am during PST)
schedule = "0 10 * * *"

[services.env]
ENVIRONMENT = "production"
